name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check HTTP endpoints
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8010 > /tmp/spam-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8010/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8010/health | python -c 'import json, sys; assert json.load(sys.stdin)["model_loaded"]'
          curl -fsS http://127.0.0.1:8010/ -o /tmp/demo.html
          grep -q 'SMS Spam Detector' /tmp/demo.html
          curl -fsS http://127.0.0.1:8010/predict -H 'Content-Type: application/json' -d '{"message":"Hey, are we still on for dinner tonight at 7?"}' | python -c 'import json, sys; assert json.load(sys.stdin)["label"] == "ham"'
